name: Evening Post — Reel 2 (6 PM IST)

on:
  schedule:
    - cron: '30 12 * * *'  # 12:30 PM UTC = 6:00 PM IST (UTC+5:30)
  workflow_dispatch:

concurrency:
  group: vedalingo-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo (no LFS)
        uses: actions/checkout@v4
        with:
          lfs: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get today's reel info
        id: reel
        run: |
          CURRENT_DAY=$(node -e "console.log(require('./automation/post-state.json').currentDay)")
          DAY_PAD=$(printf "%03d" $CURRENT_DAY)
          KEY="day${DAY_PAD}_R2"
          VIDEO_URL=$(node -e "const m=require('./cloudinary-manifest.json'); console.log(m['${KEY}']||'')")
          if [ -z "$VIDEO_URL" ]; then
            echo "❌ No manifest entry for ${KEY} — run upload-to-cloudinary.mjs locally first"
            exit 1
          fi
          INFO=$(node automation/get-reel-info.js $CURRENT_DAY 2)
          TYPE=$(echo $INFO | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).type))")
          CONTENT_ID=$(echo $INFO | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).contentId))")
          echo $INFO > /tmp/reel-info.json
          echo "day=$CURRENT_DAY" >> $GITHUB_OUTPUT
          echo "url=$VIDEO_URL" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "contentId=$CONTENT_ID" >> $GITHUB_OUTPUT
          echo "Day: $CURRENT_DAY | Type: $TYPE | ContentId: $CONTENT_ID"

      - name: Generate caption
        id: caption
        run: |
          node -e "const i=require('/tmp/reel-info.json'); process.stdout.write(i.caption)" > /tmp/caption.txt
          echo "Caption preview:"; head -3 /tmp/caption.txt

      - name: Send to Make webhook (posts to Instagram + YouTube)
        run: |
          node - <<'JSEOF'
          const fs = require('fs');
          const https = require('https');
          const info = JSON.parse(fs.readFileSync('/tmp/reel-info.json', 'utf8'));
          const caption = fs.readFileSync('/tmp/caption.txt', 'utf8').trim();
          const day = parseInt(process.env.DAY);
          const videoUrl = process.env.VIDEO_URL;
          const payload = JSON.stringify({
            video_url: videoUrl,
            caption,
            title: info.ytTitle,
            filename: `day${String(day).padStart(3,'0')}_R2_${info.contentId}.mp4`,
            day,
            reel: 'R2',
            type: info.type,
          });
          const url = new URL(process.env.WEBHOOK_URL);
          const req = https.request({ hostname: url.hostname, path: url.pathname + url.search, method: 'POST', headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(payload) } }, res => {
            console.log('Webhook sent:', res.statusCode);
          });
          req.write(payload); req.end();
          JSEOF
        env:
          DAY: ${{ steps.reel.outputs.day }}
          VIDEO_URL: ${{ steps.reel.outputs.url }}
          WEBHOOK_URL: ${{ secrets.MAKE_INSTAGRAM_WEBHOOK }}

      - name: Advance to next day + save state
        run: |
          python3 -c "
          import json
          with open('automation/post-state.json') as f:
              state = json.load(f)
          next_day = (state['currentDay'] % 90) + 1
          if next_day == 1:
              replay_until = state.pop('replayUntil', None)
              if replay_until:
                  next_day = 1
                  state['_replayEnd'] = replay_until
              else:
                  state['currentBatch'] = state.get('currentBatch', 1) + 1
          elif state.get('_replayEnd') and state['currentDay'] >= state['_replayEnd']:
              del state['_replayEnd']
              state['currentBatch'] = state.get('currentBatch', 1) + 1
              next_day = 1
          state['currentDay'] = next_day
          import datetime
          state['lastPosted'] = datetime.date.today().isoformat()
          with open('automation/post-state.json', 'w') as f:
              json.dump(state, f, indent=2)
          print('Advanced to day', state['currentDay'])
          "
          git config user.name  "VedaLingo Bot"
          git config user.email "rachna.lende@gmail.com"
          git add automation/post-state.json
          git diff --staged --quiet || git commit -m "chore: advance to next day after evening post [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

