name: Pinterest Daily Pin

on:
  schedule:
    - cron: '30 2 * * *'  # 8:00 AM IST every day
  workflow_dispatch:

jobs:
  post-pin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: automation
        run: npm install

      - name: Install system dependencies for Puppeteer
        run: sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2t64

      - name: Install npm packages
        working-directory: automation
        run: npm install puppeteer cloudinary

      - name: Generate pin image & upload to Cloudinary
        working-directory: automation
        id: generate
        env:
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          IMAGE_URL=$(node generate-pinterest-pin.mjs | tail -1)
          echo "image_url=$IMAGE_URL" >> $GITHUB_OUTPUT
          echo "Day image URL: $IMAGE_URL"

      - name: Read current day
        id: state
        run: |
          DAY=$(node -e "const s=require('./automation/post-state.json'); console.log(s.currentDay)")
          echo "day=$DAY" >> $GITHUB_OUTPUT

      - name: Post to Pinterest
        working-directory: automation
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_SANDBOX: ${{ secrets.PINTEREST_SANDBOX }}
        run: |
          node post-to-pinterest.mjs "${{ steps.generate.outputs.image_url }}" "${{ steps.state.outputs.day }}"

      - name: Advance day counter
        run: |
          node -e "
            const fs = require('fs');
            const s = require('./automation/post-state.json');
            s.currentDay = (s.currentDay % 90) + 1;
            s.totalPosted = (s.totalPosted || 0) + 1;
            s.lastPosted = new Date().toISOString().split('T')[0];
            fs.writeFileSync('./automation/post-state.json', JSON.stringify(s, null, 2));
            console.log('Day advanced to', s.currentDay, 'total posted:', s.totalPosted);
          "

      - name: Commit updated day counter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/post-state.json
          git diff --staged --quiet || git commit -m "chore: advance Pinterest pin day counter [skip ci]"
          git push
