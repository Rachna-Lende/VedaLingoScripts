name: Morning Post — Reel 1 (8 AM IST)

on:
  schedule:
    - cron: '30 2 * * *'   # 2:30 AM UTC = 8:00 AM IST (UTC+5:30)
  workflow_dispatch:

concurrency:
  group: vedalingo-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo (no LFS)
        uses: actions/checkout@v4
        with:
          lfs: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get today's reel info from manifest
        id: reel
        run: |
          STATE=$(cat automation/post-state.json)
          CURRENT_DAY=$(echo $STATE | python3 -c "import sys,json; print(json.load(sys.stdin)['currentDay'])")
          DAY_PAD=$(printf "%03d" $CURRENT_DAY)
          KEY="day${DAY_PAD}_R1"
          VIDEO_URL=$(python3 -c "import json; m=json.load(open('cloudinary-manifest.json')); print(m.get('${KEY}',''))")
          if [ -z "$VIDEO_URL" ]; then
            echo "❌ No manifest entry for ${KEY} — run upload-to-cloudinary.mjs locally first"
            exit 1
          fi
          # Derive type and contentId from manifest key or filename pattern in manifest
          FILENAME=$(basename "$VIDEO_URL" | sed 's/_[0-9]*\.mp4/.mp4/')
          TYPE=$(echo "$FILENAME" | sed 's/day[0-9]*_R[0-9]*_\([^_]*\)_.*/\1/')
          CONTENT_ID=$(echo "$FILENAME" | sed 's/day[0-9]*_R[0-9]*_[^_]*_\(.*\)\.[0-9]*.mp4/\1/' | sed 's/_[0-9]*$//')
          echo "day=$CURRENT_DAY" >> $GITHUB_OUTPUT
          echo "url=$VIDEO_URL" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "contentId=$CONTENT_ID" >> $GITHUB_OUTPUT
          echo "Day: $CURRENT_DAY, URL: $VIDEO_URL, Type: $TYPE, ContentId: $CONTENT_ID"

      - name: Generate caption
        id: caption
        run: |
          chmod +x automation/generate-caption.sh
          bash automation/generate-caption.sh "${{ steps.reel.outputs.type }}" "${{ steps.reel.outputs.contentId }}" "${{ steps.reel.outputs.day }}" > /tmp/caption.txt
          echo "Caption saved to /tmp/caption.txt"
          cat /tmp/caption.txt

      - name: Send to Make webhook (posts to Instagram + YouTube)
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json
          caption = open('/tmp/caption.txt').read().strip()
          day = ${{ steps.reel.outputs.day }}
          content_type = '${{ steps.reel.outputs.type }}'
          content_id = '${{ steps.reel.outputs.contentId }}'
          video_url = '${{ steps.reel.outputs.url }}'
          word = content_id.replace('-', ' ').title()
          title = f'Sanskrit {content_type.title()}: {word} | VedaLingo #{day}'[:100]
          payload = json.dumps({
            'video_url': video_url,
            'caption': caption,
            'title': title,
            'filename': f'day{day:03d}_R1_{content_id}.mp4',
            'day': day,
            'reel': 'R1',
            'type': content_type
          })
          req = urllib.request.Request('${{ secrets.MAKE_INSTAGRAM_WEBHOOK }}', data=payload.encode(), headers={'Content-Type': 'application/json'})
          resp = urllib.request.urlopen(req)
          print('Webhook sent:', resp.status)
          PYEOF

      - name: Save updated post-state to repo
        run: |
          git config user.name  "VedaLingo Bot"
          git config user.email "rachna.lende@gmail.com"
          git add automation/post-state.json
          git diff --staged --quiet || git commit -m "chore: update post state after morning post [skip ci]"
          git push
